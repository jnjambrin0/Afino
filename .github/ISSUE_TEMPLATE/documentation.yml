name: Documentation
description: Something in the documentation is missing, unclear or wrong.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: The file and section, or a link.
      placeholder: README.md › Install
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is missing, unclear or wrong
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Wording, an example, or where it should go.
