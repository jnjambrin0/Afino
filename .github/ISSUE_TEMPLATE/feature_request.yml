name: Feature request
description: Suggest an idea or an improvement for Afino.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem you want solved; the best solution often comes out of the discussion.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues, including closed ones.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I …, I have to …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, from your side of the keyboard.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other ways it could be solved.

  - type: textarea
    id: additional_context
    attributes:
      label: Anything else
      description: Mockups, links, or examples from other apps.
